name: Crypto data snapshot

on:
  schedule:
    - cron: "7 * * * *"   # hourly, a few minutes past the hour
  workflow_dispatch:       # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: crypto-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Hyperliquid + Binance archive data
        run: python scripts/fetch_crypto.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto/data.json crypto/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "crypto: data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
